name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: pytest --cov=novato --cov-report=term-missing
      - run: ruff check .
      - run: python -m pip wheel --no-deps . -w dist
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: [apt, dnf, pacman, zypper]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-distros.sh ${{ matrix.family }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distro-${{ matrix.family }}
          path: docs/validation/*.txt
